</style></head><body><main>
<header><div class="eyebrow">交互讲义　/　算法 01</div><h1>二分查找为什么能排除一半？</h1><p>先看括线，再看中点。试着预测：下一次比较后，哪一段还可能藏着目标？</p></header>
<section id="app" aria-label="交互实验"><p>静态示例：在 2、5、8、12、16、23、31 中找 16。比较 12 后保留 16、23、31；比较 23 后只剩 16。</p></section>
<section class="rule"><strong>成立的前提：数组有序。</strong><p>中点小于目标时，它左边的值也一定小于目标。排除这整段不是猜测，而是利用了顺序。</p></section>
<details><summary>不看动画，读一遍示例</summary><p>以 16 为目标：先与 12 比较，只保留右侧的 16、23、31；再与 23 比较，只保留左侧的 16；最后命中。换成 13 时，会缩到空区间，说明目标不存在。</p></details>
</main><!-- INLINE_LESSON --></body></html>
